<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>README Clew 2 // Claim Ledger</title>
  <meta name="description" content="Checks whether a public GitHub repo's README matches its code. Rules decide what is true.">
  <!-- Block 6b: og:image tags (/api/og) go here. -->
  <link rel="icon" href="mascot/calm.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="findings.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="terminal">
    <header class="strip title">
      <h1>README CLEW 2 // CLAIM LEDGER</h1>
      <p class="scan-time"><span class="label">SCANNED</span> <span id="scan-time" class="value">-</span></p>
    </header>

    <section class="strip input">
      <form id="scan-form" novalidate>
        <label class="prompt" for="repo-input">REPO &gt;</label>
        <input id="repo-input" name="repo" type="text" inputmode="url" autocomplete="off" spellcheck="false" maxlength="300" placeholder="https://github.com/owner/repo">
        <button id="scan-btn" class="btn" type="submit">SCAN</button>
      </form>
      <p class="hint">PUBLIC REPOS ONLY. NOTHING IS STORED.</p>
    </section>

    <div id="out" aria-live="polite"></div>
  </main>
  <noscript><p class="noscript">THIS PAGE NEEDS JAVASCRIPT TO SCAN A REPO.</p></noscript>
</body>
</html>
